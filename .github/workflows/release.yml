name: Release
# Push a tag like v0.5.0 to build Windows, macOS and Linux installers.
# They land in a DRAFT GitHub release; check it, then publish it yourself.
on:
  push:
    tags: ['v*']
  # Run by hand to build every platform without releasing (artifacts only).
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            # node-pty has no Linux prebuild, so it is rebuilt against Electron there.
            target: --linux -c.npmRebuild=true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned macOS build until signing secrets exist (see electron-builder.yml).
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
            # electron-builder leaves its uninstaller stub next to the installer; it is not a download.
            !dist/*__uninstaller*
            # electron-builder's build log (paths and config), not a download.
            !dist/builder-debug.yml
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "$GITHUB_REF_NAME" --generate-notes
