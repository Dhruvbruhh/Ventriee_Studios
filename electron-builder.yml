appId: com.ventriee.studios
productName: Ventriee Studios
copyright: Copyright © 2026 Ventriee Studios

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

# The bundled SKILL.md library is read from process.resourcesPath when packaged.
extraResources:
  - from: resources/skills
    to: skills
  # The running window reads this; the exe and shortcuts get the .ico.
  - from: build/icon.png
    to: icon.png

asar: true
compression: normal
# node-pty is N-API and ships prebuilt binaries per platform, so nothing needs
# compiling against Electron's headers (which would require C++ build tools).
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  executableName: ventriee-studios

linux:
  icon: build/icon.png
  category: Development
  syncDesktopName: true
  maintainer: Ventriee Studios <ventriee@example.com>
  # AppImage and deb need a Linux machine (the release workflow builds them);
  # from Windows, `npm run dist:linux -- --linux tar.gz` still gives the portable tarball.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  artifactName: Ventriee-Studios-${version}-${arch}.${ext}
  executableName: ventriee-studios
  synopsis: Local-first multi-agent AI creation studio
  description: >-
    Ventriee Studios is a private, local-first AI software studio. Plan in chat,
    generate works refine a development prompt, assign real CLI agents (OpenCode,
    Claude Code, Codex, Gemini, Ollama) and watch them work in a live office with
    an always-visible preview.

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: Ventriee-Studios-${version}-mac-${arch}.${ext}
  # Unsigned until there is an Apple Developer ID: set CSC_LINK / CSC_KEY_PASSWORD and
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID, remove `identity: null`, and set notarize: true.
  identity: null
  notarize: false
  hardenedRuntime: true
  extendInfo:
    NSMicrophoneUsageDescription: Voice input turns what you say into a brief or a question for the agents.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ventriee Studios
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # No spaces: GitHub renames them in uploads, which would break the updater's download path.
  artifactName: Ventriee-Studios-${version}-setup.${ext}
  deleteAppDataOnUninstall: false

portable:
  artifactName: Ventriee-Studios-${version}-portable.${ext}

# Where installed copies look for updates (latest.yml is attached to each release).
publish:
  provider: github
  owner: Dhruvbruhh
  repo: Ventriee_Studios
  releaseType: prerelease
